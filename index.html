<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MBSC Solutions</title>

    <style>

        /* =========================================
           BASIC RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #03070c;

            color: #ffffff;

        }


        /* =========================================
           PAGE
        ========================================= */

        .page {

            width: 100%;

            min-height: 100vh;

            padding: 30px 15px;

        }


        .container {

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

        }


        /* =========================================
           HERO CARD
        ========================================= */

        .hero-card {

            position: relative;

            width: 100%;

            max-width: 520px;

            min-height: 520px;

            margin: 0 auto;

            padding: 35px;

            border-radius: 28px;

            overflow: hidden;

            background:

                linear-gradient(
                    180deg,
                    #101923 0%,
                    #091018 48%,
                    #05090e 100%
                );

            border: 1px solid
                rgba(150, 190, 220, 0.25);

            box-shadow:

                0 25px 70px
                rgba(0, 0, 0, 0.55);

        }


        /* =========================================
           CARD GLOW
        ========================================= */

        .card-glow {

            position: absolute;

            width: 300px;

            height: 300px;

            top: -130px;

            right: -100px;

            border-radius: 50%;

            background:
                rgba(20, 130, 255, 0.25);

            filter: blur(80px);

            pointer-events: none;

            z-index: 0;

        }


        /* =========================================
           IMAGE AREA
        ========================================= */

        .hero-animation {

            position: absolute;

            top: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 360px;

            height: 250px;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 2;

            overflow: hidden;

        }


        /* =========================================
           PERSON IMAGE
        ========================================= */

        .hero-person-image {

            width: 100%;

            height: 100%;

            object-fit: contain;

            object-position: center;

            display: block;

            max-width: 100%;

            max-height: 100%;

        }


        /* =========================================
           QUICK ASSISTANCE TEXT
        ========================================= */

        .hero-card span {

            position: absolute;

            left: 38px;

            bottom: 180px;

            z-index: 5;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 2px;

            color: #ffd45a;

        }


        .hero-card b {

            position: absolute;

            left: 38px;

            bottom: 45px;

            z-index: 5;

            max-width: 400px;

            font-size: 32px;

            line-height: 1.18;

            font-weight: 700;

            color: #ffffff;

        }


        /* =========================================
           DESKTOP
        ========================================= */

        @media (min-width: 701px) {

            .hero-card {

                min-height: 520px;

            }


            .hero-animation {

                top: 15px;

                width: 390px;

                height: 270px;

            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .page {

                padding:
                    15px 8px;

            }


            .hero-card {

                width: 100%;

                max-width: 340px;

                min-height: 520px;

                padding: 25px;

                border-radius: 26px;

            }


            .hero-animation {

                top: 15px;

                width: 285px;

                height: 220px;

            }


            .hero-card span {

                left: 38px;

                bottom: 190px;

                font-size: 13px;

                letter-spacing: 1.7px;

            }


            .hero-card b {

                left: 38px;

                right: 25px;

                bottom: 45px;

                font-size: 29px;

                line-height: 1.28;

            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 380px) {

            .hero-card {

                max-width: 320px;

                min-height: 500px;

            }


            .hero-animation {

                width: 265px;

                height: 205px;

            }


            .hero-card span {

                bottom: 175px;

                left: 30px;

                font-size: 12px;

            }


            .hero-card b {

                left: 30px;

                bottom: 35px;

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <div class="page">

        <div class="container">


            <!-- =====================================
                 QUICK ASSISTANCE CARD
            ====================================== -->

            <div class="hero-card">


                <!-- CARD GLOW -->

                <div class="card-glow"></div>


                <!-- IMAGE -->

                <div class="hero-animation">

                    <img
                        src="ChatGPT%20Image%20Aug%209,%202026,%2010_06_19%20AM.png"
                        alt="MBSC Solutions"
                        class="hero-person-image"
                    >

                </div>


                <!-- TEXT -->

                <span>
                    QUICK ASSISTANCE
                </span>


                <b>
                    Choose a service<br>
                    and message us.
                </b>


            </div>


        </div>

    </div>


</body>

</html>
