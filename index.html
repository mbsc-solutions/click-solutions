<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MBSC Solutions</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #05070d;
            color: white;
        }

        .page {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        /* =====================================
           QUICK ASSISTANCE CARD
        ===================================== */

        .hero-card {
            position: relative;
            min-height: 360px;
            padding: 35px;
            margin-bottom: 35px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    #07152d,
                    #050914
                );

            border: 1px solid rgba(0, 174, 255, 0.25);

            overflow: hidden;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .card-glow {
            position: absolute;
            width: 280px;
            height: 280px;

            right: -80px;
            top: -100px;

            background: rgba(0, 153, 255, 0.20);

            filter: blur(80px);

            border-radius: 50%;
        }

        /* =====================================
           IMAGE
        ===================================== */

        .hero-animation {
            position: absolute;

            top: 10px;
            right: 40px;

            width: 430px;
            height: 300px;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 2;
        }

        .hero-person-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }

        /* =====================================
           TEXT
        ===================================== */

        .hero-card span {
            position: relative;

            z-index: 5;

            display: block;

            font-size: 14px;
            font-weight: 700;

            letter-spacing: 2px;

            color: #37b9ff;

            margin-bottom: 10px;
        }

        .hero-card b {
            position: relative;

            z-index: 5;

            font-size: 28px;

            line-height: 1.3;

            color: white;
        }

        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            .page {
                padding: 20px 12px;
            }

            .hero-card {
                min-height: 420px;

                padding: 25px;

                justify-content: flex-end;
            }

            .hero-animation {

                top: 10px;
                right: 50%;

                transform: translateX(50%);

                width: 320px;
                height: 260px;
            }

            .hero-card b {
                font-size: 23px;
            }

        }

    </style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- =================================
             QUICK ASSISTANCE
        ================================== -->

        <div class="hero-card">

            <div class="card-glow"></div>

            <div class="hero-animation">

                <img
                    src="ChatGPT%20Image%20Aug%209,%202026,%2010_06_19%20AM.png"
                    alt="MBSC Solutions"
                    class="hero-person-image"
                >

            </div>

            <span>
                QUICK ASSISTANCE
            </span>

            <b>
                Choose a service<br>
                and message us.
            </b>

        </div>

    </div>

</div>

</body>
</html>
