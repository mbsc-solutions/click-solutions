    .performance-grid {
      display: grid;

    }

    .performance-card {

      box-shadow: 0 3px 9px rgba(0,0,0,.15);

    .performance-card .number {

    .performance-card .label {

    .success .number { color: #4ade80; }

    .performance-updated {

  <!-- COMPACT TOTAL PERFORMANCE -->
  <section class="performance" aria-live="polite">
    <h2>TOTAL PERFORMANCE</h2>
    <p class="performance-subtitle">
      CLICK SOLUTIONS · All Services Combined
    </p>

    <div class="performance-grid">
      <div class="performance-card success">

        <span class="label">TOTAL SUCCESS</span>
      </div>

      <div class="performance-card failed">
        <span class="number" id="totalFailed">—</span>
        <span class="label">TOTAL FAILED</span>
      </div>

      <div class="performance-card pending">
        <span class="number" id="totalPending">—</span>
        <span class="label">TOTAL PENDING</span>
      </div>
    </div>

    <p class="performance-updated" id="performanceUpdated">
      Loading latest performance...
    </p>

    <p class="performance-error" id="performanceError">
      Performance could not be loaded. Please refresh the page later.
    </p>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://whxlatxnqjpccwrmtmph.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_wlqTaOkM3fML9cuUES54fw_8TlbSi-H";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    async function loadTotalPerformance() {
      const successElement =
        document.getElementById("totalSuccess");
      const failedElement =
        document.getElementById("totalFailed");
      const pendingElement =
        document.getElementById("totalPending");
      const updatedElement =
        document.getElementById("performanceUpdated");
      const errorElement =
        document.getElementById("performanceError");

      try {
        const result = await supabaseClient
          .from("service_status")
          .select(
            "success_count, failed_count, processing_count"
          );

        if (result.error) {
          throw result.error;
        }

        const totals = (result.data || []).reduce(
          function (sum, service) {
            sum.success += Number(service.success_count || 0);
            sum.failed += Number(service.failed_count || 0);
            sum.pending += Number(service.processing_count || 0);
            return sum;
          },
          { success: 0, failed: 0, pending: 0 }
        );

        successElement.textContent =
          totals.success.toLocaleString("en-IN");
        failedElement.textContent =
          totals.failed.toLocaleString("en-IN");
        pendingElement.textContent =
          totals.pending.toLocaleString("en-IN");

        updatedElement.textContent =
          "Last updated: " +
          new Date().toLocaleTimeString("en-IN");

        errorElement.style.display = "none";
      } catch (error) {
        console.error("Total performance error:", error);
        errorElement.style.display = "block";
        updatedElement.textContent =
          "Unable to retrieve the latest totals.";
      }
    }

    loadTotalPerformance();
    setInterval(loadTotalPerformance, 30000);

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        loadTotalPerformance();
      }
    });
  </script>
